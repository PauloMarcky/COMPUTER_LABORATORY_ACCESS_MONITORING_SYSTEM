services:
  db:
    image: mysql:8.4
    command: [ "--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--max-connections=40" ]
    mem_limit: 500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clams
      MYSQL_USER: clams
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  api:
    build: ./backend
    mem_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://clams:${DB_PASSWORD_URLENCODED}@db:3306/clams
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      TRUST_PROXY_HOPS: "1"
      APP_TIME_ZONE: Asia/Manila

  caddy:
    build: ./frontend
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config: